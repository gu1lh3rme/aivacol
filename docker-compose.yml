version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aivacol-sqlserver
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: YourStrong!Passw0rd
      MSSQL_PID: Developer
    ports:
      - '1433:1433'
    volumes:
      - sqlserver-data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    container_name: aivacol-redis
    ports:
      - '6379:6379'

  backend:
    build:
      context: ./backend
    container_name: aivacol-backend
    environment:
      PORT: 3000
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_USERNAME: sa
      DB_PASSWORD: YourStrong!Passw0rd
      DB_DATABASE: aivacol
      JWT_SECRET: access_secret
      JWT_REFRESH_SECRET: refresh_secret
      AUTH_EMAIL: admin@aivacol.com
      AUTH_PASSWORD: Aivacol@123
      CACHE_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - sqlserver
      - redis
    ports:
      - '3000:3000'

  frontend:
    build:
      context: ./frontend
    container_name: aivacol-frontend
    depends_on:
      - backend
    ports:
      - '4200:80'

volumes:
  sqlserver-data:
