<mat-sidenav-container class="shell-container">
  <mat-sidenav #sidenav class="shell-sidenav" [mode]="isMobile() ? 'over' : 'side'" [opened]="!isMobile()">
    <div class="brand">
      <span class="brand-mark">AV</span>
      <div>
        <strong>Aivacol</strong>
        <small>Fleet Platform</small>
      </div>
    </div>

    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/home"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeIfMobile(sidenav)"
      >
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Home</span>
      </a>

      <a mat-list-item routerLink="/vehicles" routerLinkActive="active-link" (click)="closeIfMobile(sidenav)">
        <mat-icon matListItemIcon>directions_car</mat-icon>
        <span matListItemTitle>Veículos</span>
      </a>

      <a mat-list-item routerLink="/catalog" routerLinkActive="active-link" (click)="closeIfMobile(sidenav)">
        <mat-icon matListItemIcon>dns</mat-icon>
        <span matListItemTitle>Catálogo</span>
      </a>

      <a mat-list-item routerLink="/history" routerLinkActive="active-link" (click)="closeIfMobile(sidenav)">
        <mat-icon matListItemIcon>history</mat-icon>
        <span matListItemTitle>Histórico</span>
      </a>
    </mat-nav-list>

    <button mat-stroked-button class="logout-button" type="button" (click)="logout()">
      <mat-icon>logout</mat-icon>
      Sair
    </button>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="shell-toolbar">
      @if (isMobile()) {
        <button mat-icon-button type="button" (click)="sidenav.toggle()" aria-label="Abrir menu lateral">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span>Painel da Plataforma</span>
    </mat-toolbar>

    <main class="shell-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
