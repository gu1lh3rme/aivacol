<section class="vehicles-page" aria-label="Lista de veículos">
  <header>
    <h1>Veículos</h1>
    <button mat-flat-button color="primary" (click)="goToCreate()" aria-label="Cadastrar veículo">
      Novo Veículo
    </button>
  </header>

  <form [formGroup]="filtersForm" class="filters" aria-label="Filtros de veículos">
    <mat-form-field appearance="outline">
      <mat-label>Placa</mat-label>
      <input matInput formControlName="plate" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Marca</mat-label>
      <input matInput formControlName="brand" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Modelo</mat-label>
      <input matInput formControlName="model" />
    </mat-form-field>
  </form>

  @if (state.loading()) {
    <mat-progress-bar mode="indeterminate" aria-label="Carregando veículos"></mat-progress-bar>
  }

  @if (state.hasData()) {
    <section class="table-shell" aria-label="Tabela de veículos">
      <table mat-table [dataSource]="dataSource" class="vehicles-table">
        <ng-container matColumnDef="plate">
          <th mat-header-cell *matHeaderCellDef>Placa</th>
          <td mat-cell *matCellDef="let row" class="plate-cell">
            <span>{{ row.plate }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="brand">
          <th mat-header-cell *matHeaderCellDef>Marca</th>
          <td mat-cell *matCellDef="let row">{{ row.brand?.name || '-' }}</td>
        </ng-container>

        <ng-container matColumnDef="model">
          <th mat-header-cell *matHeaderCellDef>Modelo</th>
          <td mat-cell *matCellDef="let row">{{ row.model?.name || '-' }}</td>
        </ng-container>

        <ng-container matColumnDef="year">
          <th mat-header-cell *matHeaderCellDef>Ano</th>
          <td mat-cell *matCellDef="let row">{{ row.year }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td mat-cell *matCellDef="let row" class="actions-cell">
            <button mat-icon-button (click)="editVehicle(row.id)" aria-label="Editar veículo">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button (click)="deleteVehicle(row.id, row.plate)" aria-label="Excluir veículo">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      <mat-paginator
        [length]="state.total()"
        [pageSize]="state.filters().pageSize"
        [pageSizeOptions]="[5, 10, 20]"
        (page)="changePage($event)"
        aria-label="Paginação da tabela"
      />
    </section>
  } @else {
    <app-empty-state message="Nenhum veículo encontrado com os filtros informados." />
  }
</section>
